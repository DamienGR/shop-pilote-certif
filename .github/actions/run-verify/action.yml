# The verification suite, factored out so it can run twice on two different
# runners without the steps drifting apart. See .github/workflows/verify.yml for
# why it runs twice.
name: Verification suite
description: Node toolchain, dependencies, isolated Wrangler config, and `npm run verify`.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        # The supported line is declared once, in .nvmrc; `engines` and
        # scripts/check-toolchain.mjs hold CI and every workstation to it.
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          mcp/package-lock.json

    - name: Install storefront dependencies
      run: npm ci
      shell: bash

    - name: Install MCP dependencies
      run: npm ci --prefix mcp
      shell: bash

    - name: Create isolated Wrangler configuration
      run: |
        sed \
          -e 's/__NAME__/minshop-check/g' \
          -e 's/__JURISDICTION__/eu/g' \
          -e 's/__WORKERS_DEV__/true/g' \
          -e 's/__ROUTES__/[]/g' \
          -e 's/__IMAGE_BASE_URL__//g' \
          -e 's/__ACCESS_TEAM_DOMAIN__//g' \
          -e 's/__ACCESS_AUD__//g' \
          -e 's/__STORE_NAME__/Ma boutique/g' \
          -e 's/__ENVIRONMENT__//g' \
          -e 's/__DB_NAME__/minshop-check-db/g' \
          -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
          -e 's/__BUCKET__/minshop-check-images/g' \
          -e 's/__FILES_BUCKET__/minshop-check-files/g' \
          wrangler.template.jsonc > wrangler.jsonc
      shell: bash

    - name: Run complete verification
      run: npm run verify
      shell: bash
