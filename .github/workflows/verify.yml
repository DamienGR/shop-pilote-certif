name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two runners, because the flake we cannot fix is per-runner.
  #
  # `wrangler dev` dies under the D1 gate on cloudflare/workers-sdk#15317, and
  # thirty probe runs showed the deaths are not independent: a runner that kills
  # one session usually kills the next. run-d1-integration.sh re-runs the suite
  # in place, which clears the runners that recover, and twenty more runs put
  # what is left at 5% — a hard core of runners that die on every attempt.
  #
  # Nothing inside the job reaches that. A second runner is a fresh draw, so the
  # residual goes to roughly one run in four hundred. This first attempt is
  # therefore tolerated and reports nothing but its outcome; `verify` below is
  # the verdict, and a real failure fails both.
  verify-first-runner:
    name: verify (first runner, tolerated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.suite.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run the verification suite
        id: suite
        continue-on-error: true
        uses: ./.github/actions/run-verify

  verify:
    name: verify
    needs: verify-first-runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Accept the first runner's pass
        if: needs.verify-first-runner.outputs.outcome == 'success'
        run: echo "The suite passed on the first runner; nothing to re-run."

      # Anything other than a pass lands here, an empty outcome included: a
      # first attempt that was cancelled or never reported must not be read as
      # a pass.
      - name: Check out repository
        if: needs.verify-first-runner.outputs.outcome != 'success'
        uses: actions/checkout@v6

      - name: Run the verification suite on a fresh runner
        if: needs.verify-first-runner.outputs.outcome != 'success'
        uses: ./.github/actions/run-verify

  # File ownership (plan §3.3). Two questions, one script: is every tracked path
  # still classified core / client / generated, and does this pull request touch
  # the core without saying so.
  #
  # The second only has teeth in a SHOP repository — a tree with
  # client/client.yaml — because here every pull request touches the core, and a
  # gate that fires on all of them teaches people to wave it through. It runs
  # here anyway, reporting what it would have decided, so the shops that inherit
  # this workflow inherit a step that has actually executed.
  #
  # A shop approves a deliberate core edit by labelling the pull request
  # `core-change`; the label is a reviewed act, which is the property the gate
  # is really asking for.
  paths:
    name: File ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The gate diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Classify the tree and gate the change
        env:
          MINSHOP_CORE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'core-change') && 'approved' || '' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/check-paths.mjs --changed --base "origin/${{ github.base_ref }}"

  # A store is created by cloning a tag of this repository (plan §3.4), so the
  # baseline that matters is what a FRESH CLONE builds — not what an incrementally
  # updated checkout builds. `verify` above runs in a tree that already carries a
  # rendered wrangler.jsonc and generated theme artifacts; this job proves the
  # commit stands on its own, from the committed files and the lockfiles alone.
  clean-clone:
    name: Build from a clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The script re-clones HEAD from this checkout's object store, and
          # git refuses several local-clone modes against a shallow repository.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install, build and dry-run deploy from a scratch clone
        run: npm run check:clean-clone

  # The exit criterion of jalon 2: `shopctl new` produces a shop that passes its
  # own gates with no manual step in between.
  #
  # It re-runs the deterministic half of the shop's `verify`. The parts it omits
  # — the D1 integration, the MCP dry run, the scaffolder package, the Stripe
  # country data — are properties of a core that is identical here byte for
  # byte, already proven by the `verify` job above, and the D1 gate is the one
  # with a known per-runner flake (see the two-runner comment at the top).
  #
  # What it DOES cover is the half nothing else can: this repository's own test
  # suite is core-owned, therefore shipped into every shop and executed there.
  # Four of its assertions used to assume the tree was the core; they passed
  # here and failed in the first generated shop, which is the worst possible
  # place to discover them.
  #
  # The slug comes from the run id rather than a literal, and that is not
  # cosmetic: `config:validate` fails on any CORE file containing a shop's slug,
  # and this workflow file is core-owned. A hardcoded name would leak into the
  # very gate the job exists to run.
  generated-shop:
    name: Generated shop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # `shopctl new` clones a TAG with its history; a shallow checkout has
          # neither to offer.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # The shop's first commit needs an author, exactly as it would on an
      # operator's machine. `shopctl doctor` reports a missing identity as a
      # blocking prerequisite for this reason.
      #
      # --global, not the repository-local default: the identity has to apply to
      # the SHOP, which is a different repository created later in this job. A
      # local config here would sit in the checkout and leave the shop's first
      # commit without an author.
      - name: Publish this commit as a core version tag
        id: core
        run: |
          git config --global user.name "Minshop CI"
          git config --global user.email "ci@example.com"
          version="$(node -p "require('./package.json').version")"
          git tag -f "v${version}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "slug=witness-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Create a shop from that tag
        run: |
          node shopctl/bin/shopctl.mjs new "${{ steps.core.outputs.slug }}" \
            --from "$PWD" \
            --core "${{ steps.core.outputs.tag }}" \
            --dir "$RUNNER_TEMP/generated-shop" \
            --no-install \
            --json > "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.json"

      # A shop's own CI checks out `origin` alone. `shopctl new` leaves a `core`
      # remote that no shop runner has, and a gate relying on it passed here
      # while every real shop went red (étape 2 de la certification).
      - name: Leave the shop as its own CI checks it out
        working-directory: ${{ runner.temp }}/generated-shop
        run: git remote remove core

      # Everything below runs in the SHOP, with the tooling the shop carries.
      - name: Install the shop's dependencies
        working-directory: ${{ runner.temp }}/generated-shop
        run: npm ci

      - name: Run the shop's deterministic gates
        working-directory: ${{ runner.temp }}/generated-shop
        run: |
          npm run check:toolchain
          npm run check:secrets
          npm run config:validate
          npm run check:paths
          npm test
          npx astro check
          npm run theme:check
          npx astro build
          node scripts/check-built-css.mjs
          npm run check:secrets:artifacts
          npm run test:security
          npm run check:deploy

  # Which shops exist is a property of the TREE, for the same reason the theme
  # list below is: a generated shop carries its own manifest, and a hardcoded
  # list here would stop covering it.
  discover-shops:
    name: Discover shops
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shops: ${{ steps.discover.outputs.shops }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List the shops this tree describes
        id: discover
        run: |
          shops=$(node scripts/prepare-client.mjs --list)
          echo "discovered: $shops"
          echo "shops=$shops" >> "$GITHUB_OUTPUT"

  # The exit criterion of jalon 1: two different shops build from one core.
  #
  # Everything per-shop comes from the manifest — the Wrangler configuration is
  # rendered from it, the theme is selected by it — so a value the core needed
  # to hardcode would fail here rather than on the third customer.
  #
  # It overlaps the theme matrix below today, because the two witness shops
  # happen to select the two shipped designs the main job does not build. That
  # stops being true the moment a shop takes a design of its own (jalon 5), and
  # the questions were never the same one: this job asks whether a MANIFEST
  # builds, that one whether a DESIGN holds the contract.
  shops:
    name: Build shop (${{ matrix.shop }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover-shops
    if: needs.discover-shops.outputs.shops != '[]'

    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJSON(needs.discover-shops.outputs.shops) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      # Writes wrangler.jsonc from the manifest and exports THEME for the steps
      # below. No sed of a hardcoded name: if the manifest cannot fill the
      # template, the shop does not build.
      - name: Derive the build inputs from the manifest
        run: node scripts/prepare-client.mjs "${{ matrix.shop }}"

      - name: Verify the shop builds and honours the contract
        run: npm run verify:theme

  # Every theme in the tree, the configured one included — the browser job above
  # covers all of them, unlike `themes`, which deliberately skips the theme the
  # main `verify` already built.
  discover-all-themes:
    name: Discover every theme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      themes: ${{ steps.discover.outputs.themes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List every theme in the tree
        id: discover
        run: |
          themes=$(node --input-type=module -e "
            import { discoverThemeIds } from './scripts/themes.mjs';
            console.log(JSON.stringify(discoverThemeIds()));
          ")
          echo "discovered: $themes"
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  # The browser gate (plan, jalon 5). Everything the container contracts cannot
  # see: accessibility, keyboard order, page zoom, the no-JavaScript path, and
  # the compiled design.
  #
  # Its own job rather than a step inside `verify`, because it is the one gate
  # that needs a browser. `verify` is what a shop runs on a laptop and in the
  # deploy path; making it download 150 MB of Chromium to answer would be a bad
  # trade for everyone who is not changing a template.
  #
  # Every theme, not just the pilot's. What it asserts is a set of storefront
  # contracts — a WCAG violation and an unreachable cart are defects in any
  # design — and the per-theme design signature only exists per theme.
  browser:
    name: Browser (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: discover-all-themes
    if: needs.discover-all-themes.outputs.themes != '[]'

    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover-all-themes.outputs.themes) }}

    env:
      THEME: ${{ matrix.theme }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      # The revision pinned by the @playwright/test version in package-lock,
      # with its system libraries. test/browser/chromium.mjs only ever falls
      # back to another build when this step has not run.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__JURISDICTION__/eu/g' \
            -e 's/__WORKERS_DEV__/true/g' \
            -e 's/__ROUTES__/[]/g' \
            -e 's/__IMAGE_BASE_URL__//g' \
            -e 's/__ACCESS_TEAM_DOMAIN__//g' \
            -e 's/__ACCESS_AUD__//g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            -e 's/__FILES_BUCKET__/minshop-check-files/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Run the browser suite
        run: npm run test:browser

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-trace-${{ matrix.theme }}
          path: test-results/
          retention-days: 7

  # Which themes exist is a property of the TREE, not of this file: a generated
  # store carries its merchant-owned theme plus whatever shipped themes it kept,
  # and a hardcoded list here would silently stop covering them. Discovery
  # asks the same resolver the build uses.
  discover:
    name: Discover themes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      themes: ${{ steps.discover.outputs.themes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List themes not covered by the main job
        id: discover
        run: |
          themes=$(node --input-type=module -e "
            import { discoverThemeIds, resolveConfiguredTheme } from './scripts/themes.mjs';
            const configured = resolveConfiguredTheme().id;
            console.log(JSON.stringify(discoverThemeIds().filter((id) => id !== configured)));
          ")
          echo "discovered: $themes"
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  # The main job verifies whichever theme theme.config.json names. The
  # contract suite exists precisely to hold for ANY design — so run it against
  # every other theme in the tree. Not the full `verify`: the parts this omits
  # (integration, MCP, scaffold, Stripe country data) are set-independent and
  # would only multiply the bill.
  themes:
    name: Verify theme (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover
    if: needs.discover.outputs.themes != '[]'

    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}

    env:
      THEME: ${{ matrix.theme }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__JURISDICTION__/eu/g' \
            -e 's/__WORKERS_DEV__/true/g' \
            -e 's/__ROUTES__/[]/g' \
            -e 's/__IMAGE_BASE_URL__//g' \
            -e 's/__ACCESS_TEAM_DOMAIN__//g' \
            -e 's/__ACCESS_AUD__//g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            -e 's/__FILES_BUCKET__/minshop-check-files/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Verify the theme builds and honours the contract
        run: npm run verify:theme
